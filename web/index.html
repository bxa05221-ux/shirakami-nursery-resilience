<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>保育レジリエンス α1.0</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;line-height:1.55;background:#fafafa}section{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}textarea,input,select,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;font-size:16px}button{cursor:pointer;border-radius:8px;border:1px solid #999;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#666;font-size:.9em}pre{white-space:pre-wrap;background:#f3f3f3;padding:12px;border-radius:8px;min-height:80px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style>
</head><body>
<h1>保育レジリエンス α1.0</h1><p>観測 → Landscape → 位相回転 → 明日の保育</p>
<p class="muted">AIは判断を代替しません。生成案は必ず保育者・管理者が確認、修正、承認してください。</p>
<section><h2>接続先</h2><input id="apiBase" value="http://localhost:8000/api/v1" aria-label="API URL"><button onclick="saveApi()">API接続先を保存</button><p id="conn" class="muted">Reference Runtimeへ接続できます。未接続時は端末内デモとして動作します。</p></section>
<section><h2>1. 今日の観察</h2><label>クラス</label><select id="classId"><option value="class-1">1組</option><option value="class-2">2組</option><option value="class-3">3組</option><option value="class-4">4組</option><option value="class-5">5組</option><option value="class-6">6組</option></select><label>観察内容（事実）</label><textarea id="facts" rows="5" placeholder="子どもの姿・環境・関わりなど"></textarea><label>子どもの選択・声</label><textarea id="voice" rows="3"></textarea><button onclick="saveObservation()">観測を登録</button></section>
<section><h2>2. 園Landscape</h2><div class="grid"><div><label>出席人数</label><input id="attendance" type="number" min="0" max="20" value="0"></div><div><label>配置職員数</label><input id="staff" type="number" min="0" value="0"></div></div><label>配置・環境上の気づき</label><textarea id="staffNote" rows="3"></textarea><button onclick="saveLandscape()">Landscapeを保存</button></section>
<section><h2>3. Safety Signal</h2><select id="signalType"><option value="near_miss">ヒヤリハット</option><option value="incident">インシデント</option><option value="accident">事故</option><option value="safeguarding_concern">安全・権利擁護上の懸念</option><option value="suspected_abuse">虐待が疑われる事象</option><option value="complaint">相談・苦情</option></select><textarea id="signalFacts" rows="4" placeholder="事実を入力"></textarea><button onclick="saveSignal()">Safety Signalを登録</button><p class="muted">重大な安全・虐待等は、所定の人間による初動判断・報告・関係機関との連携を優先します。</p></section>
<section><h2>4. 位相を回す</h2><button onclick="showLandscape()">現在のLandscapeを表示</button><pre id="landscape"></pre></section>
<section><h2>5. 明日の保育計画案</h2><button onclick="makePlan()">計画案を生成</button><pre id="plan"></pre><textarea id="editedPlan" rows="10" placeholder="生成案を確認・修正"></textarea><button onclick="approvePlan()">保育者確認・承認</button><p id="status" class="muted"></p></section>
<script>
const K={obs:'nursery-alpha1-observations',land:'nursery-alpha1-landscape',sig:'nursery-alpha1-signals',plan:'nursery-alpha1-plan'};const get=k=>JSON.parse(localStorage.getItem(k)||'[]');const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const base=()=>document.getElementById('apiBase').value.replace(/\/$/,'');
function saveApi(){localStorage.setItem('nursery-api-base',base());document.getElementById('conn').textContent='API接続先を保存しました。';}if(localStorage.getItem('nursery-api-base'))apiBase.value=localStorage.getItem('nursery-api-base');
async function api(path,options){const r=await fetch(base()+path,{headers:{'Content-Type':'application/json'},...options});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function saveObservation(){const f=facts.value.trim();if(!f)return alert('観察内容を入力してください');const item={class_id:classId.value,facts:[f],child_voice_or_choice:voice.value.trim()};try{await api('/observations',{method:'POST',body:JSON.stringify(item)});conn.textContent='APIへ観測を登録しました。';}catch(e){const a=get(K.obs);a.push({...item,at:new Date().toISOString()});put(K.obs,a);conn.textContent='API未接続のため端末内デモに保存しました。';}facts.value='';voice.value='';}
async function saveLandscape(){const item={class_id:classId.value,attendance:+attendance.value,assigned_staff:+staff.value,note:staffNote.value.trim()};try{await api('/landscape',{method:'POST',body:JSON.stringify(item)});}catch(e){const a=get(K.land);a.push({...item,at:new Date().toISOString()});put(K.land,a);}alert('Landscapeを保存しました');}
async function saveSignal(){const f=signalFacts.value.trim();if(!f)return alert('事実を入力してください');const item={signal_type:signalType.value,facts:[f]};try{await api('/safety/signals',{method:'POST',body:JSON.stringify(item)});}catch(e){const a=get(K.sig);a.push({...item,at:new Date().toISOString()});put(K.sig,a);}signalFacts.value='';alert('Safety Signalを登録しました');}
async function showLandscape(){try{const d=await api('/landscape/daily');landscape.textContent='【API Landscape】\n'+JSON.stringify(d,null,2)+'\n\n【位相回転】\n個別 → 集団 → 園 → 外部\n過去 → 現在 → 明日';}catch(e){const o=get(K.obs).slice(-10),l=get(K.land).slice(-6),s=get(K.sig).slice(-10);landscape.textContent='【個別】\n'+(o.length?o.map(x=>`・${x.class_id}: ${x.facts.join(' ')}`).join('\n'):'なし')+'\n\n【クラス／配置】\n'+(l.length?l.map(x=>`・${x.class_id}: 出席${x.attendance}人／職員${x.assigned_staff}人`).join('\n'):'なし')+'\n\n【Safety】\n'+(s.length?s.map(x=>`・${x.signal_type}: ${x.facts.join(' ')}`).join('\n'):'なし')+'\n\n【位相回転】\n個別 → 集団 → 園 → 外部\n過去 → 現在 → 明日';}}
async function makePlan(){try{const d=await api('/plans/tomorrow',{method:'POST',body:'{}'});plan.textContent=JSON.stringify(d,null,2);editedPlan.value=JSON.stringify(d,null,2);conn.textContent='APIから明日の計画案を取得しました。';}catch(e){const o=get(K.obs).slice(-10);const text='【明日の保育計画案｜ドラフト】\n\n■ 子どもの姿・観測\n'+(o.length?o.map(x=>'・'+x.facts.join(' ')).join('\n'):'・観測なし')+'\n\n■ 環境・集団への配慮\n・子どもの選択と主体性を確保する\n・一斉指示を必要最小限にする\n・環境調整で参加しやすくする\n\n■ 安全・人員配置を確認\n■ 明日のチェックポイント\n・子どもの選択が増えたか\n・保育者の一斉指示が減ったか\n・安全上の変化はないか\n\n※ドラフト。保育者が確認・修正・承認してください。';plan.textContent=text;editedPlan.value=text;}}
function approvePlan(){const text=editedPlan.value.trim();if(!text)return alert('計画案を入力してください');put(K.plan,[{at:new Date().toISOString(),text,status:'approved'}]);status.textContent='保育者による確認・承認を記録しました。';}
</script></body></html>
